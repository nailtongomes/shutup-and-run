
name: Cleanup GHCR Images

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    concurrency:
      group: cleanup-images
      cancel-in-progress: false

    steps:
      - name: Cleanup old GHCR images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: 'shutup-and-run'
          keep-n-tagged: 5
          exclude-tags: 'edge,v*,latest,prod,stable,deploy-*'
          delete-untagged: false
          dry-run: false
