name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl packages
        timeout-minutes: 10
        run: bash scripts/ci-apt.sh musl-tools build-essential
      - name: static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: image tag
        id: tag
        run: |
          image=ghcr.io/nailtongomes/shutup-and-run
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${image}:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build context
        run: cp target/x86_64-unknown-linux-musl/release/shutup-and-run ./shutup-and-run
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.name }}
      # The job scripts/smoke.sh runs by default. See examples/smoke-image.
      - uses: docker/build-push-action@v6
        with:
          context: examples/smoke-image
          push: true
          tags: ghcr.io/nailtongomes/shutup-and-run-smoke:latest
      # The heavy job tests/poll-mock offers. See examples/selenium-probe.
      - uses: docker/build-push-action@v6
        with:
          context: examples/selenium-probe
          push: true
          tags: ghcr.io/nailtongomes/shutup-and-run-selenium-probe:latest

  cleanup:
    needs: ghcr
    runs-on: ubuntu-latest

    concurrency:
      group: cleanup-ghcr-images
      cancel-in-progress: false

    permissions:
      packages: write

    steps:
      - name: Cleanup old GHCR images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: 'shutup-and-run'
          keep-n-tagged: 5
          exclude-tags: 'edge,v*,latest,prod,stable,deploy-*'
          delete-untagged: false
          dry-run: false
