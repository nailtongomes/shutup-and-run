name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: shellcheck scripts/*.sh
      - name: windows fallback launcher shape
        run: python3 scripts/windows/check-sar-launcher.py

  # The Windows .exe is the WSL supervisor. The GitHub-hosted runner has no
  # usable WSL2, so the doctor must stop at its first check and exit 1.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo test --locked
      - name: the .exe runs and the doctor fails cleanly without WSL
        shell: pwsh
        run: |
          .\target\release\shutup-and-run.exe --help
          .\target\release\shutup-and-run.exe wsl --help
          .\target\release\shutup-and-run.exe wsl doctor
          if ($LASTEXITCODE -ne 1) { throw "wsl doctor exited $LASTEXITCODE, expected 1" }
          # A typo must not install anything.
          .\target\release\shutup-and-run.exe wsl install --pol-url https://x/poll
          if ($LASTEXITCODE -ne 1) { throw "wsl install with a bad flag exited $LASTEXITCODE, expected 1" }
          # Both commands above are meant to exit 1, and the step would end
          # with the last exit code.
          exit 0
      # The runner has the Visual C++ Redistributable, so an .exe that needs
      # it runs here and fails on a clean PC. Read the file instead.
      - name: the .exe is a console program, needs no VC++ runtime, and prints
        shell: powershell
        run: |
          $exe = "target\release\shutup-and-run.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 3) { throw "PE subsystem is $subsystem, expected 3 (console)" }
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($dll in "vcruntime140", "msvcp140") {
            if ($text -match "(?i)$dll") { throw "the .exe mentions $dll.dll: it would not start on a clean Windows" }
          }
          $help = (& $exe wsl --help) -join "`n"
          if ($help -notmatch "wsl doctor") { throw "wsl --help printed nothing to the terminal" }
          $doctor = (& $exe wsl doctor) -join "`n"
          if ($doctor -notmatch "wsl") { throw "wsl doctor printed nothing to the terminal" }
          exit 0
      - name: every .ps1 parses
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1 scripts, tests | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($_.FullName): $e"; $bad++ }
          }
          if ($bad -ne 0) { throw "$bad PowerShell parse error(s)" }
      # Windows PowerShell 5.1, which is what a client's PC has. The runner's
      # user is an administrator, so this does not prove the non-administrator
      # path; tests/windows-sandbox does that by hand.
      - name: install.ps1 twice on PowerShell 5.1, then the logon task
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "shutup-and-run-x86_64-pc-windows-msvc.exe"
          $rel = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item target\release\shutup-and-run.exe (Join-Path $rel $asset)
          $want = (Get-FileHash -Algorithm SHA256 (Join-Path $rel $asset)).Hash.ToLower()
          Set-Content -Encoding ascii -Path (Join-Path $rel "SHA256SUMS") -Value "$want  $asset"
          $server = Start-Process python -ArgumentList "-m", "http.server", "8099", "--bind", "127.0.0.1", "--directory", $rel -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:SHUTUP_AND_RUN_EXE_URL = "http://127.0.0.1:8099/$asset"
          $env:SHUTUP_AND_RUN_POLL_URL = ""
          $installed = Join-Path $env:ProgramData "shutup-and-run\shutup-and-run.exe"

          # The second round is the one that used to abort: the .exe is there
          # and the task is not.
          foreach ($round in "fresh", "update") {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 ($round) exited $LASTEXITCODE" }
            $got = (Get-FileHash -Algorithm SHA256 $installed).Hash.ToLower()
            if ($got -ne $want) { throw "install.ps1 ($round): installed hash $got, expected $want" }
          }

          # A wrong checksum installs nothing and leaves the old .exe.
          Set-Content -Encoding ascii -Path (Join-Path $rel "SHA256SUMS") -Value "$('0' * 64)  $asset"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
          if ($LASTEXITCODE -eq 0) { throw "install.ps1 accepted a wrong checksum" }
          $got = (Get-FileHash -Algorithm SHA256 $installed).Hash.ToLower()
          if ($got -ne $want) { throw "a refused install changed the .exe" }
          Stop-Process -Id $server.Id -Force

          # Step 7 of the install, alone: register, look, remove.
          & $installed wsl task register
          if ($LASTEXITCODE -ne 0) { throw "wsl task register exited $LASTEXITCODE" }
          $task = Get-ScheduledTask -TaskName shutup-and-run
          $trigger = $task.Triggers[0]
          if ($trigger.CimClass.CimClassName -ne "MSFT_TaskLogonTrigger") { throw "trigger is $($trigger.CimClass.CimClassName)" }
          if (-not $trigger.UserId) { throw "the logon trigger is not tied to a user" }
          if ("$($task.Settings.ExecutionTimeLimit)" -ne "PT0S") { throw "ExecutionTimeLimit is $($task.Settings.ExecutionTimeLimit)" }
          if ($task.Settings.DisallowStartIfOnBatteries) { throw "the task would not start on battery" }
          if ("$($task.Settings.MultipleInstances)" -ne "IgnoreNew") { throw "MultipleInstances is $($task.Settings.MultipleInstances)" }
          & $installed wsl task remove
          if (Get-ScheduledTask -TaskName shutup-and-run -ErrorAction SilentlyContinue) { throw "the task survived wsl task remove" }
          exit 0
      # For tests/windows-sandbox/run.ps1 -Exe, before a release has this build.
      - uses: actions/upload-artifact@v4
        with:
          name: shutup-and-run-windows-exe
          path: target/release/shutup-and-run.exe
          retention-days: 7

  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: release binary
        run: cargo build --release --locked
      - name: acceptance, then smoke.sh against the same instance
        timeout-minutes: 30
        run: sudo SHUTUP_AND_RUN_SMOKE=1 bash scripts/accept.sh "${GITHUB_WORKSPACE}/target/release/shutup-and-run"

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl packages
        timeout-minutes: 10
        run: bash scripts/ci-apt.sh musl-tools build-essential
      - name: static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/shutup-and-run
          file "$bin" | grep -E 'statically linked|static-pie linked'
          ldd "$bin" >/tmp/ldd.txt 2>&1 || true
          cat /tmp/ldd.txt
          if grep -E '=>|not found' /tmp/ldd.txt | grep -v 'statically linked'; then
            echo "dynamic dependency"
            exit 1
          fi
          grep -E 'statically linked|not a dynamic executable' /tmp/ldd.txt
      - name: the scratch image starts
        run: |
          cp target/x86_64-unknown-linux-musl/release/shutup-and-run ./shutup-and-run
          docker build -t shutup-and-run:ci .
          docker run --rm shutup-and-run:ci --help
          rm ./shutup-and-run
      # What a release does, with the binary just built: install.sh downloads
      # the asset and SHA256SUMS, checks them, and starts the systemd service
      # over HTTPS. Then every smoke scenario runs against that service.
      - name: serve a local release
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/shutup-and-run dist/shutup-and-run-x86_64-unknown-linux-musl
          # Same shape as the published v0.1.0 file: "hash  dist/<asset>".
          # A basename-only line still matches. A wrong hash is the next step.
          sha256sum dist/shutup-and-run-x86_64-unknown-linux-musl > dist/SHA256SUMS
          grep -q ' dist/shutup-and-run-x86_64-unknown-linux-musl$' dist/SHA256SUMS
          (cd dist && nohup python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
      - name: install.sh refuses a wrong checksum
        run: |
          mkdir -p bad
          cp dist/shutup-and-run-x86_64-unknown-linux-musl bad/
          echo "$(printf '0%.0s' {1..64})  shutup-and-run-x86_64-unknown-linux-musl" > bad/SHA256SUMS
          (cd bad && nohup python3 -m http.server 8098 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          if sudo SHUTUP_AND_RUN_URL=http://127.0.0.1:8098/shutup-and-run-x86_64-unknown-linux-musl bash scripts/install.sh; then
            echo "install.sh accepted a binary that does not match SHA256SUMS"
            exit 1
          fi
          test ! -e /usr/local/bin/shutup-and-run
      - name: install.sh from the local release
        run: |
          # The smoke image is built here. The instance fails to pull it and
          # uses this local copy, which is how a machine without registry
          # access behaves.
          docker build -t ghcr.io/nailtongomes/shutup-and-run-smoke examples/smoke-image
          docker pull hello-world
          sudo SHUTUP_AND_RUN_URL=http://127.0.0.1:8099/shutup-and-run-x86_64-unknown-linux-musl \
            SHUTUP_AND_RUN_ALLOWLIST=ghcr.io/nailtongomes/shutup-and-run-smoke,hello-world bash scripts/install.sh
      - name: smoke the installed service
        timeout-minutes: 15
        run: |
          printf 'SHUTUP_AND_RUN_POLL_URL=http://127.0.0.1:18790/poll\nSHUTUP_AND_RUN_POLL_INTERVAL_SECS=2\n' | sudo tee -a /etc/shutup-and-run/env >/dev/null
          sudo systemctl restart shutup-and-run
          sudo SMOKE_LOCAL=1 SMOKE_POLL=1 SMOKE_STRICT=1 \
            SMOKE_RESTART_CMD="systemctl restart shutup-and-run" bash scripts/smoke.sh
          # The image without a shell: the reduced set must pass, the rest skip.
          sudo SMOKE_LOCAL=1 SMOKE_IMAGE=hello-world bash scripts/smoke.sh 1 2 5 6 7 9 11
      - name: service log
        if: always()
        run: sudo journalctl -u shutup-and-run -n 100 --no-pager || true
      - name: uninstall
        run: |
          sudo bash scripts/install.sh --uninstall --purge
          test ! -e /usr/local/bin/shutup-and-run
          test ! -e /etc/shutup-and-run
