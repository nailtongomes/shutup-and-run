name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: shellcheck scripts/*.sh

  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: release binary
        run: cargo build --release --locked
      - name: acceptance, then smoke.sh against the same instance
        timeout-minutes: 30
        run: sudo SHUTUP_AND_RUN_SMOKE=1 bash scripts/accept.sh "${GITHUB_WORKSPACE}/target/release/shutup-and-run"

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools build-essential
      - name: static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/shutup-and-run
          file "$bin" | grep -E 'statically linked|static-pie linked'
          ldd "$bin" >/tmp/ldd.txt 2>&1 || true
          cat /tmp/ldd.txt
          if grep -E '=>|not found' /tmp/ldd.txt | grep -v 'statically linked'; then
            echo "dynamic dependency"
            exit 1
          fi
          grep -E 'statically linked|not a dynamic executable' /tmp/ldd.txt
