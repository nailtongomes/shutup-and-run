name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: shellcheck scripts/*.sh

  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: release binary
        run: cargo build --release --locked
      - name: acceptance, then smoke.sh against the same instance
        timeout-minutes: 30
        run: sudo SHUTUP_AND_RUN_SMOKE=1 bash scripts/accept.sh "${GITHUB_WORKSPACE}/target/release/shutup-and-run"

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools build-essential
      - name: static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/shutup-and-run
          file "$bin" | grep -E 'statically linked|static-pie linked'
          ldd "$bin" >/tmp/ldd.txt 2>&1 || true
          cat /tmp/ldd.txt
          if grep -E '=>|not found' /tmp/ldd.txt | grep -v 'statically linked'; then
            echo "dynamic dependency"
            exit 1
          fi
          grep -E 'statically linked|not a dynamic executable' /tmp/ldd.txt
      - name: the scratch image starts
        run: |
          cp target/x86_64-unknown-linux-musl/release/shutup-and-run ./shutup-and-run
          docker build -t shutup-and-run:ci .
          docker run --rm shutup-and-run:ci --help
          rm ./shutup-and-run
      # What a release does, with the binary just built: install.sh downloads
      # the asset and SHA256SUMS, checks them, and starts the systemd service
      # over HTTPS. Then every smoke scenario runs against that service.
      - name: serve a local release
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/shutup-and-run dist/shutup-and-run-x86_64-unknown-linux-musl
          (cd dist && sha256sum shutup-and-run-x86_64-unknown-linux-musl > SHA256SUMS)
          (cd dist && nohup python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
      - name: install.sh refuses a wrong checksum
        run: |
          mkdir -p bad
          cp dist/shutup-and-run-x86_64-unknown-linux-musl bad/
          echo "$(printf '0%.0s' {1..64})  shutup-and-run-x86_64-unknown-linux-musl" > bad/SHA256SUMS
          (cd bad && nohup python3 -m http.server 8098 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          if sudo SHUTUP_AND_RUN_URL=http://127.0.0.1:8098/shutup-and-run-x86_64-unknown-linux-musl bash scripts/install.sh; then
            echo "install.sh accepted a binary that does not match SHA256SUMS"
            exit 1
          fi
          test ! -e /usr/local/bin/shutup-and-run
      - name: install.sh from the local release
        run: |
          # The smoke image is built here. The instance fails to pull it and
          # uses this local copy, which is how a machine without registry
          # access behaves.
          docker build -t ghcr.io/nailtongomes/shutup-and-run-smoke examples/smoke-image
          docker pull hello-world
          sudo SHUTUP_AND_RUN_URL=http://127.0.0.1:8099/shutup-and-run-x86_64-unknown-linux-musl \
            SHUTUP_AND_RUN_ALLOWLIST=ghcr.io/nailtongomes/shutup-and-run-smoke,hello-world bash scripts/install.sh
      - name: smoke the installed service
        timeout-minutes: 15
        run: |
          printf 'SHUTUP_AND_RUN_POLL_URL=http://127.0.0.1:18790/poll\nSHUTUP_AND_RUN_POLL_INTERVAL_SECS=2\n' | sudo tee -a /etc/shutup-and-run/env >/dev/null
          sudo systemctl restart shutup-and-run
          sudo SMOKE_LOCAL=1 SMOKE_POLL=1 SMOKE_STRICT=1 \
            SMOKE_RESTART_CMD="systemctl restart shutup-and-run" bash scripts/smoke.sh
          # The image without a shell: the reduced set must pass, the rest skip.
          sudo SMOKE_LOCAL=1 SMOKE_IMAGE=hello-world bash scripts/smoke.sh 1 2 5 6 7 9 11
      - name: service log
        if: always()
        run: sudo journalctl -u shutup-and-run -n 100 --no-pager || true
      - name: uninstall
        run: |
          sudo bash scripts/install.sh --uninstall --purge
          test ! -e /usr/local/bin/shutup-and-run
          test ! -e /etc/shutup-and-run
