name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash -n scripts/accept.sh
      - run: cargo test --locked

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: binary is static
        run: |
          bin=target/x86_64-unknown-linux-musl/release/n3-launcher
          file "$bin" | grep -E 'statically linked|static-pie linked'
          ldd "$bin" >/tmp/ldd.txt 2>&1 || true
          cat /tmp/ldd.txt
          if grep -E '=>|not found' /tmp/ldd.txt | grep -v 'statically linked'; then
            echo "dependência dinâmica"
            exit 1
          fi
          grep -E 'statically linked|not a dynamic executable' /tmp/ldd.txt
