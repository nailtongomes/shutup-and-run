# On tag v*, attach the musl binary and SHA256SUMS to the GitHub release.
# install.sh downloads that asset from releases/latest and checks SHA256SUMS.
# A second job then runs the README one-liner on a fresh runner and smokes
# the service it installed. Tag from main: the one-liner fetches install.sh
# from main.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl packages
        timeout-minutes: 10
        run: bash scripts/ci-apt.sh musl-tools build-essential
      - name: static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: pack
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/shutup-and-run dist/shutup-and-run-x86_64-unknown-linux-musl
          sha256sum dist/shutup-and-run-x86_64-unknown-linux-musl > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: shutup-and-run-x86_64-unknown-linux-musl
          path: |
            dist/shutup-and-run-x86_64-unknown-linux-musl
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shutup-and-run-x86_64-unknown-linux-musl
            dist/SHA256SUMS

  install:
    needs: musl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the README one-liner
        run: curl -fsSL https://raw.githubusercontent.com/nailtongomes/shutup-and-run/main/scripts/install.sh | sudo bash
      - name: installed binary is this release's asset
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS" -o SHA256SUMS
          test "$(awk '{ print $1; exit }' SHA256SUMS)" = "$(sha256sum /usr/local/bin/shutup-and-run | awk '{ print $1 }')"
      - name: smoke the installed service
        timeout-minutes: 15
        run: |
          docker build -t ghcr.io/nailtongomes/shutup-and-run-smoke examples/smoke-image
          sudo sed -i 's#"ghcr.io/owner/selenium-worker"#"ghcr.io/nailtongomes/shutup-and-run-smoke"#' /etc/shutup-and-run/config.toml
          printf 'SHUTUP_AND_RUN_POLL_URL=http://127.0.0.1:18790/poll\nSHUTUP_AND_RUN_POLL_INTERVAL_SECS=2\n' | sudo tee -a /etc/shutup-and-run/env >/dev/null
          sudo systemctl restart shutup-and-run
          sudo SMOKE_LOCAL=1 SMOKE_POLL=1 SMOKE_STRICT=1 \
            SMOKE_RESTART_CMD="systemctl restart shutup-and-run" bash scripts/smoke.sh
      - name: service log
        if: always()
        run: sudo journalctl -u shutup-and-run -n 100 --no-pager || true
