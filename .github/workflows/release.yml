# Builds a static musl binary. Attaching it to a Release assumes a
# GitHub-compatible Releases API and a token in GITHUB_TOKEN (GitHub,
# and Forgejo or Gitea when they emulate that API). The compile itself
# does not. actions/upload-artifact keeps the binary on the workflow
# run when no release is published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools build-essential
      - name: static musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: pack
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/fairlead dist/fairlead-x86_64-unknown-linux-musl
          sha256sum dist/fairlead-x86_64-unknown-linux-musl > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fairlead-x86_64-unknown-linux-musl
          path: |
            dist/fairlead-x86_64-unknown-linux-musl
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fairlead-x86_64-unknown-linux-musl
            dist/SHA256SUMS
