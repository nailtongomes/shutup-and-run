[package]
name = "n3-launcher"
version = "0.1.0"
edition = "2021"
description = "Lança containers de RPA sob demanda, com slots limitados por máquina."
publish = false
rust-version = "1.85"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
