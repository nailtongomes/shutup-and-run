# The operator's relay for `shutup-and-run internet on`. docs/INTERNET.md.
#
#   docker compose up -d --build
#
# PCs dial in on 7000, the one port published. Your containers join the
# network `egress` and use the proxy http://ID:SECRET@relay:8080, where ID
# and SECRET are what `shutup-and-run internet credentials` prints on the PC.
# 8080 is not published: only containers on `egress` reach it. To reach it
# from another datacenter, publish it on a private address or a VPN only,
# never on the internet: it goes out through someone's home connection.
services:
  relay:
    build: .
    command:
      - --agents=0.0.0.0:7000
      - --proxy=0.0.0.0:8080
      # Chrome takes no proxy login. A port with none, through one PC, from
      # a .env file beside this one (PC_ID=..., PC_SECRET=...):
      # - --open=8101=${PC_ID}:${PC_SECRET}
    ports:
      - "7000:7000"
    networks: [egress]
    restart: unless-stopped
    read_only: true
    mem_limit: 128m

networks:
  egress: {}
