# The operator's relay for `shutup-and-run internet on`. docs/SERVIDOR.pt-BR.md.
#
#   echo "RELAY_TOKEN=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')" > .env
#   docker compose up -d
#
# Already have a compose file on your server? Paste the `relay` service
# below into it, and RELAY_TOKEN into its .env.
#
# PCs dial in on 7000, the one port published to the internet, with the
# token (`internet on --token`). The proxy, 8080, is for your containers only:
# - services of this compose file: http://ID:SECRET@relay:8080;
# - the jobs of a shutup-and-run worker on this server (Docker's default
#   network): http://ID:SECRET@172.17.0.1:8080, published on Docker's bridge
#   address only, which the internet does not reach.
# ID and SECRET are the PC's login (`internet credentials` on the PC, or the
# `--login` you gave it). From another datacenter, publish 8080 on a VPN
# address only, never on the internet: it goes out through someone's home.
services:
  relay:
    image: ghcr.io/nailtongomes/shutup-and-run-relay:latest
    environment:
      # Only PCs with this token connect.
      SHUTUP_AND_RUN_RELAY_TOKEN: ${RELAY_TOKEN:?put RELAY_TOKEN in .env}
    # Chrome takes no proxy login. A port with none, through one PC:
    # command: [--agents=0.0.0.0:7000, --proxy=0.0.0.0:8080, "--open=8101=${PC_ID}:${PC_SECRET}"]
    # and, under ports: - "172.17.0.1:8101:8101"
    ports:
      - "7000:7000"
      - "172.17.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
